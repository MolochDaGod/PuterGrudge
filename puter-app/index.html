<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Puter Monitor AI — GrudgeOS WebOS App" />
  <meta name="theme-color" content="#0a0a12" />
  <title>Puter Monitor AI</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    :root {
      --bg: #0a0a12;
      --cyan: #00f5ff;
      --text: #e8e8ff;
      --muted: #8b8b9b;
      --card: #12121e;
      --border: rgba(0, 245, 255, 0.22);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    .shell { display: flex; flex-direction: column; height: 100%; }
    header {
      display: flex; align-items: center; gap: 14px; padding: 10px 16px;
      border-bottom: 1px solid var(--border); background: rgba(10,10,18,0.95);
    }
    header h1 { font-size: 15px; margin: 0; letter-spacing: 0.02em; }
    header span { font-size: 12px; color: var(--muted); }
    header a {
      margin-left: auto; color: var(--cyan); text-decoration: none; font-size: 13px;
      border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px;
    }
    header a:hover { background: rgba(0,245,255,0.08); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .actions button {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px; cursor: pointer; font-size: 13px;
    }
    .actions button:hover { border-color: var(--cyan); color: var(--cyan); }
    iframe { flex: 1; width: 100%; border: 0; background: #000; }
    .boot {
      position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 20;
    }
    .boot.hidden { display: none; }
    .boot-card {
      max-width: 420px; padding: 28px; border-radius: 16px; border: 1px solid var(--border);
      background: radial-gradient(ellipse at top, rgba(0,245,255,0.12), transparent 55%), var(--card);
      text-align: center;
    }
    .boot-card h2 { margin: 0 0 8px; font-size: 20px; }
    .boot-card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .boot-card button {
      background: linear-gradient(135deg, #3b82f6, #00f5ff); color: #061018; border: 0;
      border-radius: 10px; padding: 12px 20px; font-weight: 700; cursor: pointer; font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="boot" id="boot">
    <div class="boot-card">
      <h2>Puter Monitor AI</h2>
      <p>GrudgeOS v3 collaborative WebOS. Sign in with Puter for free AI / KV / FS (user-pays). Fleet APIs run on production Render.</p>
      <button type="button" id="launchBtn">Launch GrudgeOS</button>
    </div>
  </div>
  <div class="shell" id="shell" hidden>
    <header>
      <h1>Puter Monitor AI</h1>
      <span id="userLabel">Guest</span>
      <a id="fullLink" href="https://puter-monitor-ai.vercel.app/" target="_blank" rel="noopener">Full screen</a>
    </header>
    <div class="actions">
      <button type="button" data-go="https://grudgewarlords.com">Warlords</button>
      <button type="button" data-go="https://open.grudge-studio.com">Open</button>
      <button type="button" data-go="https://forge.grudge-studio.com">Forge</button>
      <button type="button" data-go="https://id.grudge-studio.com">Grudge ID</button>
      <button type="button" id="signInBtn">Puter Sign-In</button>
    </div>
    <iframe id="osFrame" title="GrudgeOS Desktop" src="about:blank" allow="clipboard-read; clipboard-write"></iframe>
  </div>
  <script>
    const PROD = 'https://puter-monitor-ai.vercel.app/';
    const boot = document.getElementById('boot');
    const shell = document.getElementById('shell');
    const frame = document.getElementById('osFrame');
    const userLabel = document.getElementById('userLabel');

    async function refreshUser() {
      try {
        if (typeof puter === 'undefined' || !puter.auth) return;
        const u = await puter.auth.getUser().catch(() => null);
        userLabel.textContent = u?.username || (puter.auth.isSignedIn?.() ? 'Signed in' : 'Guest');
      } catch {
        userLabel.textContent = 'Guest';
      }
    }

    function launch() {
      boot.classList.add('hidden');
      shell.hidden = false;
      frame.src = PROD;
      refreshUser();
    }

    document.getElementById('launchBtn').addEventListener('click', launch);
    document.getElementById('signInBtn').addEventListener('click', async () => {
      try {
        if (puter?.auth) await puter.auth.signIn();
        await refreshUser();
      } catch (e) {
        console.warn(e);
      }
    });
    document.querySelectorAll('[data-go]').forEach((btn) => {
      btn.addEventListener('click', () => window.open(btn.getAttribute('data-go'), '_blank', 'noopener'));
    });

    // Auto-launch when embedded as Puter app after short splash
    setTimeout(() => {
      if (!boot.classList.contains('hidden')) launch();
    }, 400);
  </script>
</body>
</html>
