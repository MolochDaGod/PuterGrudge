<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grudge 3D Viewer</title>
  <link rel="icon" type="image/png" href="/grudgeos/assets/icons/cloudpilot-logo.png" />
  <style>
    :root {
      --bg: #0a0a12;
      --panel: rgba(18, 18, 32, 0.92);
      --border: rgba(0, 245, 255, 0.28);
      --cyan: #00f5ff;
      --purple: #8b5cf6;
      --text: #e8e8ff;
      --muted: #8b8b9b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: system-ui, "Segoe UI", sans-serif;
    }
    #app { display: flex; flex-direction: column; width: 100%; height: 100%; }
    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      padding: 8px 12px; background: var(--panel);
      border-bottom: 1px solid var(--border); z-index: 2;
    }
    .toolbar h1 {
      font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
      color: var(--cyan); margin-right: 8px; white-space: nowrap;
    }
    .toolbar button, .toolbar label.btn, .toolbar select {
      appearance: none; border: 1px solid var(--border); background: #141428;
      color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 12px;
      cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .toolbar button:hover, .toolbar label.btn:hover, .toolbar select:hover {
      border-color: var(--cyan); background: rgba(0, 245, 255, 0.08);
    }
    .toolbar button.primary {
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      border: none; color: #061018; font-weight: 700;
    }
    .toolbar input[type="text"] {
      flex: 1; min-width: 140px; max-width: 360px;
      background: #0e0e1a; border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 6px 10px; font-size: 12px;
    }
    .toolbar input[type="file"] { display: none; }
    .status {
      margin-left: auto; font-size: 11px; color: var(--muted);
      max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .status.ok { color: #00ff88; }
    .status.err { color: #ff6b8a; }
    #viewport {
      flex: 1; position: relative; min-height: 0; background: #05050a;
    }
    #viewport canvas { display: block; width: 100% !important; height: 100% !important; }
    #drop-hint {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      pointer-events: none; color: var(--muted); font-size: 14px; text-align: center;
      background: radial-gradient(ellipse at center, rgba(139,92,246,0.12), transparent 60%);
      transition: opacity 0.2s;
    }
    #drop-hint strong { color: var(--cyan); display: block; margin-bottom: 6px; font-size: 16px; }
    #viewport.dragging #drop-hint {
      opacity: 1; background: rgba(0, 245, 255, 0.08);
      outline: 2px dashed var(--cyan); outline-offset: -12px;
    }
    #drop-hint.hidden { opacity: 0; }
    .side {
      position: absolute; top: 12px; right: 12px; width: 200px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; font-size: 11px; z-index: 2; backdrop-filter: blur(10px);
    }
    .side h3 { font-size: 11px; color: var(--cyan); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.06em; }
    .side p { color: var(--muted); line-height: 1.5; margin-bottom: 4px; }
    .side .val { color: var(--text); }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div class="toolbar">
      <h1>3D Viewer</h1>
      <label class="btn" for="file-input">Open GLB / GLTF</label>
      <input id="file-input" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" />
      <select id="preset" title="Sample models">
        <option value="">Samples…</option>
        <option value="helmet">Damaged Helmet</option>
        <option value="heart">Local Heart</option>
        <option value="demo">Neon Demo</option>
      </select>
      <input id="url-input" type="text" placeholder="https://…/model.glb" />
      <button type="button" class="primary" id="btn-load-url">Load URL</button>
      <button type="button" id="btn-reset">Reset cam</button>
      <button type="button" id="btn-wire">Wireframe</button>
      <button type="button" id="btn-auto">Auto-rotate</button>
      <span class="status" id="status">Ready — drop a .glb or pick a sample</span>
    </div>
    <div id="viewport">
      <div id="drop-hint">
        <div>
          <strong>Grudge 3D Viewer</strong>
          Drop a .glb / .gltf here, or use Open / Samples
        </div>
      </div>
      <div class="side">
        <h3>Scene</h3>
        <p>Meshes: <span class="val" id="stat-meshes">0</span></p>
        <p>Tris: <span class="val" id="stat-tris">0</span></p>
        <p>Size: <span class="val" id="stat-size">—</span></p>
        <p>File: <span class="val" id="stat-name">—</span></p>
        <p style="margin-top:10px;opacity:0.8">LMB orbit · RMB pan · scroll zoom</p>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const viewport = document.getElementById('viewport');
    const dropHint = document.getElementById('drop-hint');
    const statusEl = document.getElementById('status');
    const fileInput = document.getElementById('file-input');
    const urlInput = document.getElementById('url-input');
    const preset = document.getElementById('preset');

    const PRESETS = {
      helmet: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r170/examples/models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf',
      heart: '/grudgeos/geometries/heart.gltf',
    };

    let renderer, scene, camera, controls, currentRoot = null;
    let autoRotate = true;
    let wireframe = false;
    const clock = new THREE.Clock();

    function setStatus(msg, kind = '') {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }

    function init() {
      const w = viewport.clientWidth || 800;
      const h = viewport.clientHeight || 600;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(w, h);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      viewport.insertBefore(renderer.domElement, dropHint);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05050a);
      scene.fog = new THREE.Fog(0x05050a, 12, 40);

      camera = new THREE.PerspectiveCamera(50, w / h, 0.01, 200);
      camera.position.set(2.2, 1.4, 2.8);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.autoRotate = autoRotate;
      controls.autoRotateSpeed = 1.2;
      controls.target.set(0, 0.4, 0);

      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

      const hemi = new THREE.HemisphereLight(0x88ccff, 0x221133, 0.85);
      scene.add(hemi);
      const key = new THREE.DirectionalLight(0xffffff, 1.2);
      key.position.set(4, 8, 3);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x00f5ff, 0.45);
      rim.position.set(-3, 2, -4);
      scene.add(rim);

      // Ground grid
      const grid = new THREE.GridHelper(20, 40, 0x8b5cf6, 0x1a1a2e);
      grid.position.y = 0;
      scene.add(grid);
      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(6, 64),
        new THREE.MeshStandardMaterial({ color: 0x0c0c16, metalness: 0.4, roughness: 0.7 }),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.001;
      scene.add(ground);

      window.addEventListener('resize', onResize);
      animate();
      loadDemo();
    }

    function onResize() {
      const w = viewport.clientWidth;
      const h = Math.max(1, viewport.clientHeight);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    function clearModel() {
      if (!currentRoot) return;
      scene.remove(currentRoot);
      currentRoot.traverse((obj) => {
        if (obj.geometry) obj.geometry.dispose?.();
        if (obj.material) {
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          mats.forEach((m) => {
            m.map?.dispose?.();
            m.dispose?.();
          });
        }
      });
      currentRoot = null;
    }

    function fitCameraToObject(object) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z, 0.001);
      const dist = maxDim * 1.8;
      controls.target.copy(center);
      camera.position.set(center.x + dist * 0.7, center.y + dist * 0.45, center.z + dist * 0.9);
      camera.near = maxDim / 100;
      camera.far = maxDim * 100;
      camera.updateProjectionMatrix();
      controls.update();

      document.getElementById('stat-size').textContent =
        `${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)} m`;
    }

    function updateStats(root) {
      let meshes = 0;
      let tris = 0;
      root.traverse((o) => {
        if (o.isMesh && o.geometry) {
          meshes++;
          const idx = o.geometry.index;
          const pos = o.geometry.attributes.position;
          tris += idx ? idx.count / 3 : (pos ? pos.count / 3 : 0);
        }
      });
      document.getElementById('stat-meshes').textContent = String(meshes);
      document.getElementById('stat-tris').textContent = Math.round(tris).toLocaleString();
    }

    function applyWireframe(root, enabled) {
      root.traverse((o) => {
        if (o.isMesh && o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach((m) => { m.wireframe = enabled; });
        }
      });
    }

    function placeModel(object, name) {
      clearModel();
      currentRoot = object;
      scene.add(currentRoot);
      applyWireframe(currentRoot, wireframe);
      fitCameraToObject(currentRoot);
      updateStats(currentRoot);
      document.getElementById('stat-name').textContent = name || 'model';
      dropHint.classList.add('hidden');
    }

    function loadDemo() {
      const group = new THREE.Group();
      // Neon core sphere
      const core = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.55, 2),
        new THREE.MeshStandardMaterial({
          color: 0x8b5cf6,
          emissive: 0x3b1f7a,
          metalness: 0.65,
          roughness: 0.25,
        }),
      );
      group.add(core);
      // Orbit ring
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(1.05, 0.04, 12, 64),
        new THREE.MeshStandardMaterial({
          color: 0x00f5ff,
          emissive: 0x00a0b0,
          metalness: 0.8,
          roughness: 0.2,
        }),
      );
      ring.rotation.x = Math.PI / 2.4;
      group.add(ring);
      // Floating cubes
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        const cube = new THREE.Mesh(
          new THREE.BoxGeometry(0.18, 0.18, 0.18),
          new THREE.MeshStandardMaterial({
            color: i % 2 ? 0x00f5ff : 0xff00aa,
            emissive: i % 2 ? 0x003344 : 0x330022,
            metalness: 0.5,
            roughness: 0.35,
          }),
        );
        cube.position.set(Math.cos(a) * 1.5, 0.35 + Math.sin(a * 2) * 0.15, Math.sin(a) * 1.5);
        group.add(cube);
      }
      group.userData.isDemo = true;
      placeModel(group, 'Neon Demo');
      setStatus('Demo scene loaded — open a GLB for production assets', 'ok');
    }

    const loader = new GLTFLoader();
    const draco = new DRACOLoader();
    draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/');
    loader.setDRACOLoader(draco);

    async function loadGltf(url, name) {
      setStatus(`Loading ${name || url}…`);
      try {
        const gltf = await loader.loadAsync(url);
        const root = gltf.scene || gltf.scenes?.[0];
        if (!root) throw new Error('Empty glTF scene');
        placeModel(root, name || url.split('/').pop());
        setStatus(`Loaded ${name || 'model'}`, 'ok');
      } catch (err) {
        console.error(err);
        setStatus(`Load failed: ${err.message || err}`, 'err');
      }
    }

    async function loadFile(file) {
      if (!file) return;
      const url = URL.createObjectURL(file);
      try {
        await loadGltf(url, file.name);
      } finally {
        // keep blob until next load
        setTimeout(() => URL.revokeObjectURL(url), 60_000);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      if (currentRoot?.userData?.isDemo) {
        currentRoot.rotation.y = t * 0.35;
        currentRoot.children.forEach((c, i) => {
          if (c.geometry?.type === 'BoxGeometry') {
            c.position.y = 0.35 + Math.sin(t * 1.5 + i) * 0.2;
            c.rotation.x = t * 0.6 + i;
            c.rotation.y = t * 0.4;
          }
        });
      }
      controls.update();
      renderer.render(scene, camera);
    }

    // UI
    fileInput.addEventListener('change', () => {
      const f = fileInput.files?.[0];
      if (f) loadFile(f);
      fileInput.value = '';
    });
    document.getElementById('btn-load-url').addEventListener('click', () => {
      const u = urlInput.value.trim();
      if (u) loadGltf(u, u.split('/').pop());
    });
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-load-url').click();
    });
    preset.addEventListener('change', () => {
      const v = preset.value;
      if (!v) return;
      if (v === 'demo') loadDemo();
      else if (PRESETS[v]) loadGltf(PRESETS[v], preset.selectedOptions[0]?.text || v);
      preset.value = '';
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
      if (currentRoot) fitCameraToObject(currentRoot);
      else {
        camera.position.set(2.2, 1.4, 2.8);
        controls.target.set(0, 0.4, 0);
        controls.update();
      }
      setStatus('Camera reset', 'ok');
    });
    document.getElementById('btn-wire').addEventListener('click', () => {
      wireframe = !wireframe;
      if (currentRoot) applyWireframe(currentRoot, wireframe);
      setStatus(wireframe ? 'Wireframe on' : 'Wireframe off', 'ok');
    });
    document.getElementById('btn-auto').addEventListener('click', () => {
      autoRotate = !autoRotate;
      controls.autoRotate = autoRotate;
      setStatus(autoRotate ? 'Auto-rotate on' : 'Auto-rotate off', 'ok');
    });

    // Drag & drop
    ;['dragenter', 'dragover'].forEach((ev) => {
      viewport.addEventListener(ev, (e) => {
        e.preventDefault();
        viewport.classList.add('dragging');
      });
    });
    ;['dragleave', 'drop'].forEach((ev) => {
      viewport.addEventListener(ev, (e) => {
        e.preventDefault();
        viewport.classList.remove('dragging');
      });
    });
    viewport.addEventListener('drop', (e) => {
      const f = e.dataTransfer?.files?.[0];
      if (f && /\.(glb|gltf)$/i.test(f.name)) loadFile(f);
      else setStatus('Drop a .glb or .gltf file', 'err');
    });

    // Query param: ?url=
    const params = new URLSearchParams(location.search);
    const qUrl = params.get('url') || params.get('model');
    init();
    if (qUrl) loadGltf(qUrl, qUrl.split('/').pop());
  </script>
</body>
</html>
